[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ordo"
version = "0.1.0"
description = "Ordo - stdlib-only task and deadline planner with history, postpone tracking and pluggable reminders."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ordo = "ordo.cli:main"

[tool.setuptools.packages.find]
include = ["ordo*"]
